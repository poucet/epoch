[package]
name = "epoch-cas"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1"
zstd = "0.13"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
