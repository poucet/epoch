[package]
name = "epoch-fuse"
version.workspace = true
edition.workspace = true

[features]
default = []
fuser-adapter = ["fuser-support", "fuser/macos-no-mount"]
fuser-mount = ["fuser-support"]
fuser-support = ["dep:fuser"]

[dependencies]
epoch-vfs-api = { path = "../epoch-vfs-api" }
epoch-vfs = { path = "../epoch-vfs" }
epoch-cas = { path = "../epoch-cas" }
epoch-cas-moka = { path = "../epoch-cas-moka" }
epoch-cas-redb = { path = "../epoch-cas-redb" }
epoch-history = { path = "../epoch-history" }
epoch-timeline-redb = { path = "../epoch-timeline-redb" }
redb = "2"
fuser = { version = "0.17", optional = true }
libc = "0.2"

# macOS mounts through the privileged `mount_macfuse` helper (see src/macfuse.rs):
# socketpair + SCM_RIGHTS fd passing, plus fcntl/umount. `nix` is already in the
# tree via fuser, so this adds no new transitive cost.
#
# `macfuse-4-compat` is REQUIRED on macOS: macFUSE 4.x/5.x send a 16-byte
# `fuse_rename_in` (newdir + flags + padding), while fuser defaults to the
# Linux 8-byte layout (newdir only). Without the feature the two name strings
# are read out of the zero padding and arrive EMPTY — rename(2) fails 100% of
# the time (mv, editor atomic saves, `jj git init` all break). The feature only
# changes that one struct's parse width, so it must stay macOS-only: on Linux
# the extra 8 bytes do not exist and enabling it there would break rename
# symmetrically. Cargo unions features per-target, so Linux builds are
# unaffected by this declaration.
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.17", optional = true, features = ["macfuse-4-compat"] }
nix = { version = "0.30", features = ["socket", "fs", "mount"] }

[[bin]]
name = "epoch-fuse"
path = "src/main.rs"
required-features = ["fuser-support"]
