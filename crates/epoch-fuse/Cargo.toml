[package]
name = "epoch-fuse"
version.workspace = true
edition.workspace = true

[features]
default = []
fuser-adapter = ["fuser-support", "fuser/macos-no-mount"]
fuser-mount = ["fuser-support"]
fuser-support = ["dep:fuser"]

[dependencies]
epoch-vfs-api = { path = "../epoch-vfs-api" }
epoch-vfs = { path = "../epoch-vfs" }
epoch-cas = { path = "../epoch-cas" }
epoch-cas-moka = { path = "../epoch-cas-moka" }
epoch-cas-redb = { path = "../epoch-cas-redb" }
epoch-history = { path = "../epoch-history" }
epoch-timeline-redb = { path = "../epoch-timeline-redb" }
redb = "2"
fuser = { version = "0.17", optional = true }

# macOS mounts through the privileged `mount_macfuse` helper (see src/macfuse.rs):
# socketpair + SCM_RIGHTS fd passing, plus fcntl/umount. `nix` is already in the
# tree via fuser, so this adds no new transitive cost.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30", features = ["socket", "fs", "mount"] }
libc = "0.2"

[[bin]]
name = "epoch-fuse"
path = "src/main.rs"
required-features = ["fuser-support"]
